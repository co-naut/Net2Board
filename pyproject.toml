[project]
name = "net2board"
version = "0.2.0"
description = "Model the physical realization of a circuit - netlist to board layout - as a library for an external AI orchestrator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/net2board"]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = [
    "slow: kicad-cli oracle tier (opt-in; auto-skips when kicad-cli is absent)",
]
